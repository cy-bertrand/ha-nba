blueprint:
  name: NBA - Notification de match
  description: >
    Envoie une notification au debut et/ou a la fin d'un match de vos equipes
    favorites. Le message affiche le score et l'heure locale.
  domain: automation
  input:
    notify_service:
      name: Service de notification
      description: "Ex. notify.mobile_app_mon_telephone"
      selector:
        text:
    notify_start:
      name: Notifier le debut du match
      default: true
      selector:
        boolean:
    notify_end:
      name: Notifier la fin du match
      default: true
      selector:
        boolean:
    only_favorites:
      name: Equipes favorites uniquement
      description: >
        L'integration n'envoie deja des evenements que pour vos equipes favorites.
        Laissez vide pour toutes, ou saisissez l'identifiant d'une seule equipe
        (ex. 13 pour les Lakers) pour filtrer davantage.
      default: ""
      selector:
        text:

trigger_variables:
  notify_start: !input notify_start
  notify_end: !input notify_end
  team_filter: !input only_favorites

trigger:
  - platform: event
    event_type: nba_game_start
    id: start
  - platform: event
    event_type: nba_game_end
    id: end

condition:
  - condition: template
    value_template: >
      {{ (trigger.id == 'start' and notify_start) or (trigger.id == 'end' and notify_end) }}
  - condition: template
    value_template: >
      {{ team_filter | string | trim == ''
         or (team_filter | string | trim) in (trigger.event.data.favorite_team_ids | default([])) }}

action:
  - service: !input notify_service
    data:
      title: >
        {% if trigger.id == 'start' %}
          🏀 Match commence : {{ trigger.event.data.away }} @ {{ trigger.event.data.home }}
        {% else %}
          🏁 Match termine : {{ trigger.event.data.away }} @ {{ trigger.event.data.home }}
        {% endif %}
      message: >
        {% set a = trigger.event.data.away_score | int(0) %}
        {% set h = trigger.event.data.home_score | int(0) %}
        {% if trigger.id == 'start' %}
          Coup d'envoi ! {{ trigger.event.data.away }} - {{ trigger.event.data.home }}
          ({{ now().strftime('%H:%M') }})
        {% else %}
          {{ trigger.event.data.away }} {{ a }} - {{ h }} {{ trigger.event.data.home }}
          {% if a > h %}
            Victoire de {{ trigger.event.data.away }}
          {% elif h > a %}
            Victoire de {{ trigger.event.data.home }}
          {% endif %}
        {% endif %}
mode: queued
