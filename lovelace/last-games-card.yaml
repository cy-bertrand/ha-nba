# Derniers matchs d'une équipe, avec détails au clic.
# PRÉREQUIS : installer "button-card" via HACS > Interface (custom:button-card).
# ADAPTEZ le nom du capteur (Outils de développement > États, cherchez "derniers_matchs").
#
# Au clic sur un match : le service nba.get_game_details est appelé et le détail
# (score par quart-temps, meilleurs joueurs) s'affiche dans une notification
# persistante en haut de l'écran Home Assistant.
type: vertical-stack
cards:
  - type: markdown
    title: 🏀 Derniers matchs
    content: >-
      {% set s = states.sensor.los_angeles_lakers_derniers_matchs %}
      {% if s %}<div style="text-align:center"><img src="{{ s.attributes.team_logo }}" width="50">
      <br><b>Série : {{ s.state }}</b></div>{% else %}Capteur introuvable : adaptez son nom.{% endif %}
  - type: custom:button-card
    entity: sensor.los_angeles_lakers_derniers_matchs
    show_name: false
    show_icon: false
    show_state: false
    styles:
      card:
        - padding: 0
        - background: none
        - box-shadow: none
    custom_fields:
      list: >
        [[[
          const games = entity.attributes.games || [];
          return games.map((g, i) => `
            <div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(128,128,128,.25)">
              <span style="width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;font-weight:bold;color:#fff;background:${g.result === 'V' ? '#43a047' : '#e53935'}">${g.result}</span>
              <img src="${g.opp_logo}" width="28">
              <span style="flex:1">${g.home_away} ${g.opp_abbr}<br><small style="opacity:.6">${g.day || ''}</small></span>
              <b>${g.team_score} - ${g.opp_score}</b>
            </div>`).join('');
        ]]]
    styles:
      custom_fields:
        list:
          - width: 100%
  # Une rangée cliquable par match (jusqu'à 5)
  - type: grid
    columns: 5
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.los_angeles_lakers_derniers_matchs
        show_state: false
        show_icon: false
        name: "[[[ const g=(entity.attributes.games||[])[0]; return g ? `${g.result} ${g.opp_abbr}` : '-'; ]]]"
        styles:
          card:
            - font-size: 12px
        tap_action:
          action: call-service
          service: nba.get_game_details
          service_data:
            game_id: "[[[ return (entity.attributes.games||[])[0]?.id; ]]]"
      - type: custom:button-card
        entity: sensor.los_angeles_lakers_derniers_matchs
        show_state: false
        show_icon: false
        name: "[[[ const g=(entity.attributes.games||[])[1]; return g ? `${g.result} ${g.opp_abbr}` : '-'; ]]]"
        styles:
          card:
            - font-size: 12px
        tap_action:
          action: call-service
          service: nba.get_game_details
          service_data:
            game_id: "[[[ return (entity.attributes.games||[])[1]?.id; ]]]"
